var VERT="attribute vec2 a;varying vec2 v;void main(){v=a*0.5+0.5;v.y=1.0-v.y;gl_Position=vec4(a,0.0,1.0);}";

var FRAG=[
"precision mediump float;",
"uniform sampler2D t;",
"uniform vec3 p[10];",   // x, y, strength
"uniform vec2 q[10];",   // velocity
"uniform float ar;",
"varying vec2 v;",
"void main(){",
"  vec2 o=vec2(0.0);",
"  for(int i=0;i<10;i++){",
"    float s=p[i].z;",
"    if(s<=0.002) continue;",
"    vec2 d=(v-p[i].xy)*vec2(ar,1.0);",
"    float f=exp(-dot(d,d)*42.0)*s;",
"    o+=q[i]*f*1.35;",
"    o+=normalize(d+vec2(0.0001))*f*0.014;",
"  }",
"  vec2 a=clamp(v-o*1.05,0.0,1.0);",
"  vec2 b=clamp(v-o,0.0,1.0);",
"  vec2 c=clamp(v-o*0.95,0.0,1.0);",
"  gl_FragColor=vec4(texture2D(t,a).r,texture2D(t,b).g,texture2D(t,c).b,1.0);",
"}"].join("\n");

var N=10;

function Liquid(canvas,src){
  var gl=canvas.getContext("webgl",{alpha:false,antialias:false,depth:false})
       ||canvas.getContext("experimental-webgl",{alpha:false});
  if(!gl){ fallback(canvas,src); return null; }

  function sh(type,code){
    var s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){return null}
    return s;
  }
  var vs=sh(gl.VERTEX_SHADER,VERT), fs=sh(gl.FRAGMENT_SHADER,FRAG);
  if(!vs||!fs){ fallback(canvas,src); return null; }
  var pr=gl.createProgram();
  gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){ fallback(canvas,src); return null; }
  gl.useProgram(pr);

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,"a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  var uP=gl.getUniformLocation(pr,"p"),
      uQ=gl.getUniformLocation(pr,"q"),
      uAr=gl.getUniformLocation(pr,"ar");

  var pts=new Float32Array(N*3), vel=new Float32Array(N*2), head=0;
  var live=false, raf=0;

  var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);

  function size(){
    var r=canvas.getBoundingClientRect();
    if(!r.width)return;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
    if(canvas.width!==w||canvas.height!==h){
      canvas.width=w;canvas.height=h;
      gl.viewport(0,0,w,h);
      gl.uniform1f(uAr,r.width/r.height);
    }
  }
  function draw(){
    gl.uniform3fv(uP,pts);
    gl.uniform2fv(uQ,vel);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  function loop(){
    var any=false;
    for(var i=0;i<N;i++){
      var k=i*3+2;
      if(pts[k]>0.002){ pts[k]*=0.9; vel[i*2]*=0.9; vel[i*2+1]*=0.9; any=true; }
      else pts[k]=0;
    }
    draw();
    if(any){ raf=requestAnimationFrame(loop); } else { live=false; }
  }
  function push(x,y,dx,dy){
    var i=head%N; head++;
    pts[i*3]=x; pts[i*3+1]=y; pts[i*3+2]=1.0;
    vel[i*2]=dx; vel[i*2+1]=dy;
    if(!live){ live=true; raf=requestAnimationFrame(loop); }
  }

  var img=new Image();
  img.onload=function(){
    size();
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,img);
    draw();
    canvas.classList.add("ready");
  };
  img.onerror=function(){ fallback(canvas,src); };
  img.src=src;

  var lx=null,ly=null;
  function move(e){
    var r=canvas.getBoundingClientRect();
    if(!r.width)return;
    var x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    if(x<-0.1||x>1.1||y<-0.1||y>1.1){lx=ly=null;return}
    var dx=lx===null?0:x-lx, dy=ly===null?0:y-ly;
    lx=x;ly=y;
    push(x,y,dx,dy);
  }
  canvas.addEventListener("pointermove",move);
  canvas.addEventListener("pointerdown",function(e){lx=ly=null;move(e)});
  canvas.addEventListener("pointerleave",function(){lx=ly=null});
  window.addEventListener("resize",function(){ size(); draw(); },{passive:true});

  return {resize:function(){size();draw()}};
}

function fallback(canvas,src){
  var i=document.createElement("img");
  i.className="fallback";i.src=src;i.alt="Wedding invitation for Joseph and Helga, 01 October 2026";
  i.onload=function(){i.classList.add("ready")};
  canvas.parentNode.replaceChild(i,canvas);
}

var a=Liquid(document.getElementById("c0"),SRC[0]);
var b=Liquid(document.getElementById("c1"),SRC[1]);

/* ---- swipe between the two sides; slow drags liquify instead ---- */
var track=document.getElementById("track"),
    dots=[document.getElementById("d0"),document.getElementById("d1")],
    idx=0, sx=0, st=0, down=false;

function go(n){
  idx=Math.max(0,Math.min(1,n));
  track.classList.toggle("to-back",idx===1);
  document.body.classList.toggle("on-back",idx===1);
  dots[0].classList.toggle("on",idx===0);
  dots[1].classList.toggle("on",idx===1);
  setTimeout(function(){ if(a)a.resize(); if(b)b.resize(); },900);
}
dots[0].addEventListener("click",function(){go(0)});
dots[1].addEventListener("click",function(){go(1)});

window.addEventListener("pointerdown",function(e){down=true;sx=e.clientX;st=Date.now()});
window.addEventListener("pointerup",function(e){
  if(!down)return; down=false;
  var dx=e.clientX-sx, dt=Date.now()-st;
  if(Math.abs(dx)>55&&dt<600) go(idx+(dx<0?1:-1));
});
window.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(idx+1);
  if(e.key==="ArrowLeft")go(idx-1);
});
})();
</script>
